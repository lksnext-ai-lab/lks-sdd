services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: lks_sdd
      POSTGRES_PASSWORD: reference-only-not-production
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lks_sdd -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: reference-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: reference-only-not-production
    volumes: [./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro]
    ports: ["18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://lks_sdd:reference-only-not-production@postgres:5432/app
      OIDC_ISSUER: http://keycloak:8080/realms/lks-sdd
      OIDC_AUDIENCE: account
    ports: ["18000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports: ["15173:8080"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
