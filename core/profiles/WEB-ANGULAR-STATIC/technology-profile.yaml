{
  "schema_version": "2.0",
  "id": "WEB-ANGULAR-STATIC",
  "version": "1.0.0",
  "family_id": "FAM-WEB-SPA-STATIC",
  "profile_scope": "deployable",
  "lifecycle": "active",
  "support_level": "H1",
  "default_rigor": "P1",
  "summary": "Angular standalone single-page application compiled to immutable static assets without an application server.",
  "units": [{"role": "frontend", "runtime": "browser and static host", "default_path": "."}],
  "dimensions": {
    "frontend": [
      {"name": "Node.js", "version_range": "24.x LTS", "required": true},
      {"name": "Angular", "version_range": "22.1.x", "required": true},
      {"name": "TypeScript", "version_range": "6.0.x", "required": true}
    ],
    "backend": [],
    "data": [],
    "identity": [],
    "integration": [],
    "delivery": [{"name": "static hosting", "version_range": "immutable-bundle contract 1.0", "required": true}],
    "testing": [
      {"name": "Vitest", "version_range": "4.1.x", "required": true},
      {"name": "Playwright", "version_range": "1.62.x", "required": true},
      {"name": "axe-core", "version_range": "4.13.x", "required": true}
    ],
    "observability": [{"name": "client error and delivery monitoring", "version_range": "project decision", "required": false}]
  },
  "required_capabilities": ["CAP-SCAFFOLD-COPY", "CAP-FRONTEND-QUALITY", "CAP-STATIC-BUNDLE", "CAP-BROWSER-PLAYWRIGHT", "CAP-DELIVERY-EVIDENCE"],
  "excluded_capabilities": ["CAP-API-CONTRACT", "CAP-IDENTITY-OIDC", "CAP-DATA-POSTGRES", "CAP-OCI-RUNTIME", "CAP-SSR-RUNTIME", "CAP-MESSAGE-RABBITMQ", "CAP-STREAM-KAFKA"],
  "capability_bindings": [
    {"capability_id": "CAP-SCAFFOLD-COPY", "provider": "LKS-SDD copy driver", "version_range": "1.0.0"},
    {"capability_id": "CAP-FRONTEND-QUALITY", "provider": "ESLint + TypeScript + Vitest", "version_range": "10 / 6 / 4"},
    {"capability_id": "CAP-STATIC-BUNDLE", "provider": "Angular CLI and npm", "version_range": "22.1"},
    {"capability_id": "CAP-BROWSER-PLAYWRIGHT", "provider": "Playwright and axe-core", "version_range": "1.62 / 4.13"},
    {"capability_id": "CAP-DELIVERY-EVIDENCE", "provider": "LKS-SDD G4 evidence", "version_range": "1.0.0"}
  ],
  "compatibility_rules": [
    "The profile excludes a project-owned backend, server-side rendering, identity and server persistence.",
    "Selection requires a confirmed ADR and cannot be inferred from Angular requirements.",
    "Deep-link fallback, runtime configuration and browser support are explicit project decisions.",
    "A build-time environment change creates a different artifact and digest."
  ],
  "drivers": {"prepare": "profile-driver.json", "verify": "profile-driver.json"},
  "gates": {
    "capability_gate_ids": [
      "GATE-SCAFFOLD-INTEGRITY", "GATE-FRONTEND-LOCK", "GATE-FRONTEND-LINT",
      "GATE-FRONTEND-TYPECHECK", "GATE-FRONTEND-TEST", "GATE-FRONTEND-BUILD",
      "GATE-STATIC-OUTPUT", "GATE-BROWSER-SMOKE", "GATE-BROWSER-ACCESSIBILITY",
      "GATE-DELIVERY-EVIDENCE"
    ],
    "composition_gate_id": "GATE-COMPOSE-ANGULAR-STATIC"
  },
  "certification": {
    "technical_gate": "passed",
    "composition_gate": "passed",
    "e2e_eval": "passed",
    "human_review": "not-applicable",
    "pilot": "not-applicable",
    "validated_at": "2026-08-21",
    "review_due": "2026-11-21",
    "evidence": [
      "python scripts/validate_reference_profile.py --profile WEB-ANGULAR-STATIC",
      "python scripts/run_reference_profile_gate.py --profile WEB-ANGULAR-STATIC --runtime docker",
      "tests/test_multi_profile_delivery.py"
    ]
  },
  "owner": "LKS-SDD maintainers"
}
