[project]
name = "lks-sdd-local-auth"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.125.0", "sqlalchemy==2.0.45", "alembic==1.17.2", "PyJWT==2.10.1", "uvicorn==0.38.0", "psycopg[binary]==3.3.2", "argon2-cffi==25.1.0"]
[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.3", "mypy==2.3.1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py313"
line-length = 140
[tool.ruff.lint]
select = ["F", "E9"]
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
