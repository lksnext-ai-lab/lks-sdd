{
  "schema_version": "2.0",
  "id": "WEB-FASTAPI-REACT-KEYCLOAK-PG",
  "version": "2.1.0",
  "family_id": "FAM-WEB-SYSTEM",
  "profile_scope": "system",
  "lifecycle": "active",
  "support_level": "H1",
  "default_rigor": "P1",
  "summary": "Composed React SPA, FastAPI API, PostgreSQL and Keycloak OIDC system delivered as OCI containers.",
  "units": [
    {"role": "frontend", "runtime": "static assets behind nginx", "default_path": "apps/frontend"},
    {"role": "api", "runtime": "Python ASGI", "default_path": "apps/backend"},
    {"role": "identity", "runtime": "Keycloak", "default_path": "infra/keycloak"},
    {"role": "database", "runtime": "PostgreSQL", "default_path": "infra/compose"}
  ],
  "dimensions": {
    "frontend": [
      {"name": "Node.js", "version_range": "24.x LTS", "required": true},
      {"name": "React", "version_range": "19.2.x", "required": true},
      {"name": "TypeScript", "version_range": "6.0.x", "required": true},
      {"name": "Vite", "version_range": "8.x", "required": true}
    ],
    "backend": [
      {"name": "Python", "version_range": "3.14.x", "required": true},
      {"name": "FastAPI", "version_range": "0.141.x", "required": true},
      {"name": "SQLAlchemy", "version_range": "2.0.x", "required": true},
      {"name": "Alembic", "version_range": "1.19.x", "required": true}
    ],
    "data": [{"name": "PostgreSQL", "version_range": "18.x", "required": true}],
    "identity": [
      {"name": "Keycloak", "version_range": "26.7.x", "required": true},
      {"name": "OpenID Connect", "version_range": "1.0", "required": true}
    ],
    "integration": [{"name": "OpenAPI", "version_range": "3.1.x", "required": true}],
    "delivery": [
      {"name": "OCI containers", "version_range": "digest-pinned", "required": true},
      {"name": "Docker Compose", "version_range": "2.x or compatible", "required": true}
    ],
    "testing": [
      {"name": "pytest", "version_range": "9.1.x", "required": true},
      {"name": "Vitest", "version_range": "4.1.x", "required": true},
      {"name": "Playwright", "version_range": "1.62.x", "required": true}
    ],
    "observability": [{"name": "structured logging", "version_range": "profile contract 2.0", "required": true}]
  },
  "required_capabilities": [
    "CAP-SCAFFOLD-COPY", "CAP-FRONTEND-QUALITY", "CAP-STATIC-BUNDLE", "CAP-BROWSER-PLAYWRIGHT",
    "CAP-API-CONTRACT", "CAP-IDENTITY-OIDC", "CAP-DATA-POSTGRES",
    "CAP-OCI-RUNTIME", "CAP-FULLSTACK-E2E", "CAP-DELIVERY-EVIDENCE"
  ],
  "excluded_capabilities": ["CAP-SSR-RUNTIME", "CAP-MESSAGE-RABBITMQ", "CAP-STREAM-KAFKA"],
  "capability_bindings": [
    {"capability_id": "CAP-SCAFFOLD-COPY", "provider": "LKS-SDD copy driver", "version_range": "1.0.0"},
    {"capability_id": "CAP-FRONTEND-QUALITY", "provider": "ESLint + TypeScript + Vitest", "version_range": "10 / 6 / 4"},
    {"capability_id": "CAP-STATIC-BUNDLE", "provider": "React + Vite", "version_range": "React 19.2 / Vite 8"},
    {"capability_id": "CAP-BROWSER-PLAYWRIGHT", "provider": "Playwright Chromium", "version_range": "1.62.x"},
    {"capability_id": "CAP-API-CONTRACT", "provider": "FastAPI", "version_range": "0.141.x"},
    {"capability_id": "CAP-IDENTITY-OIDC", "provider": "Keycloak", "version_range": "26.7.x"},
    {"capability_id": "CAP-DATA-POSTGRES", "provider": "PostgreSQL + Alembic", "version_range": "18.x / 1.19.x"},
    {"capability_id": "CAP-OCI-RUNTIME", "provider": "Docker Compose", "version_range": "2.x"},
    {"capability_id": "CAP-FULLSTACK-E2E", "provider": "Playwright + FastAPI + PostgreSQL", "version_range": "profile contract 2.1"},
    {"capability_id": "CAP-DELIVERY-EVIDENCE", "provider": "LKS-SDD G4 evidence", "version_range": "1.0.0"}
  ],
  "compatibility_rules": [
    "Selection requires a confirmed ADR and never happens automatically.",
    "The exact profile lock and every deployable binding remain immutable inputs.",
    "OIDC uses Authorization Code with PKCE for the SPA and issuer/audience validation in the API.",
    "Database changes require migrations plus rollback, restore or forward-fix analysis.",
    "A system profile is supported only with its exact composition gate; component gates alone are insufficient."
  ],
  "drivers": {"prepare": "profile-driver.json", "verify": "profile-driver.json"},
  "gates": {
    "capability_gate_ids": [
      "GATE-SCAFFOLD-INTEGRITY", "GATE-FRONTEND-LOCK", "GATE-FRONTEND-LINT",
      "GATE-FRONTEND-TYPECHECK", "GATE-FRONTEND-TEST", "GATE-FRONTEND-BUILD",
      "GATE-STATIC-OUTPUT", "GATE-BROWSER-SMOKE", "GATE-BROWSER-ACCESSIBILITY",
      "GATE-API-LOCK", "GATE-API-LINT", "GATE-API-TYPECHECK", "GATE-API-TEST",
      "GATE-API-OPENAPI", "GATE-OIDC-CONTRACT", "GATE-OIDC-INTEGRATION",
      "GATE-DATA-MIGRATION", "GATE-DATA-INTEGRATION", "GATE-OCI-BUILD",
      "GATE-OCI-SMOKE", "GATE-BROWSER-FULLSTACK-E2E", "GATE-DELIVERY-EVIDENCE"
    ],
    "composition_gate_id": "GATE-BROWSER-FULLSTACK-E2E"
  },
  "certification": {
    "technical_gate": "passed",
    "composition_gate": "passed",
    "e2e_eval": "passed",
    "human_review": "not-run",
    "pilot": "not-applicable",
    "validated_at": "2026-08-30",
    "review_due": "2026-11-30",
    "evidence": [
      "python scripts/validate_reference_profile.py --profile WEB-FASTAPI-REACT-KEYCLOAK-PG",
      "python scripts/run_reference_profile_gate.py --profile WEB-FASTAPI-REACT-KEYCLOAK-PG --runtime docker --containers",
      "python tests/run_unit_tests.py"
    ]
  },
  "owner": "LKS-SDD maintainers"
}
