      "GATE-OIDC-CONTRACT", "GATE-OIDC-SPA-PKCE", "GATE-OIDC-SPA-SESSION", "GATE-OIDC-SIMULATED-SAFETY", "GATE-OIDC-SIMULATED-INTEGRATION",
