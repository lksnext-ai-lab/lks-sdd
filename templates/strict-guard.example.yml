# Example only. Copy to a consumer repository after choosing protected refs,
# required checks, review rules and a trusted Python runtime. This file is not
# an active workflow in the LKS-SDD plugin.
name: lks-sdd-strict-guard
on: [pull_request]
jobs:
  strict-guard:
    runs-on: ubuntu-latest
    steps:
      # Replace all example refs with refs selected by repository administrators.
      # Never read verifier code or the approved contract from the candidate.
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted-code-base
      - uses: actions/checkout@v4
        with:
          ref: approved-contract-ref
          path: approved-contract
      - uses: actions/checkout@v4
        with:
          repository: lksnext-ai-lab/lks-sdd
          ref: v2.3.0
          path: trusted-verifier
      - name: Install the trusted verifier's pinned runtime dependencies
        run: python -m pip install --require-hashes -r trusted-verifier/requirements-runtime.txt
      - name: Check complete patch and authorized scope
        run: >-
          python trusted-verifier/scripts/lks_sdd.py v2 guard candidate
          --base trusted-code-base --approved approved-contract
          --strict --task TASK-001 --environment test --json
