[project]
name = "lks-sdd-kafka-processor"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiokafka==0.14.0",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["lks_sdd_stream"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lks_sdd_stream"]
