asyncapi: 3.0.0
info:
  title: LKS-SDD stream processor
  version: 1.0.0
channels:
  events:
    address: events.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
operations:
  processEvents:
    action: receive
    channel:
      $ref: '#/channels/events'
components:
  messages:
    DomainEvent:
      payload:
        type: object
        required: [event_id, aggregate_id, schema_version, payload]
        properties:
          event_id: {type: string}
          aggregate_id: {type: string}
          schema_version: {type: integer, minimum: 1}
          payload: {type: object}
