    "testing": [
      {"name": "Vitest", "version_range": "4.1.x", "required": true},
      {"name": "Playwright", "version_range": "1.62.x", "required": true}
    ],
    "observability": [{"name": "server and client telemetry", "version_range": "project decision", "required": true}]
  },
  "required_capabilities": ["CAP-SCAFFOLD-COPY", "CAP-FRONTEND-QUALITY", "CAP-SSR-RUNTIME", "CAP-BROWSER-PLAYWRIGHT", "CAP-DELIVERY-EVIDENCE"],
