{
  "schema_version": "2.0",
  "id": "STR-PYTHON-KAFKA-PROCESSOR-OCI",
  "version": "1.0.0-candidate.1",
  "family_id": "FAM-STR-PROCESSOR",
  "profile_scope": "deployable",
  "lifecycle": "candidate",
  "support_level": "H2",
  "default_rigor": "P1",
  "summary": "Candidate Python Kafka stream processor with partition keys, explicit offsets, replay and lag recovery contracts.",
  "units": [
    {
      "role": "stream-processor",
      "runtime": "Python processor in OCI with Kafka",
      "default_path": "."
    }
  ],
  "dimensions": {
    "frontend": [],
    "backend": [
      {
        "name": "Python",
        "version_range": "3.14.x",
        "required": true
      }
    ],
    "data": [],
    "identity": [],
    "integration": [
      {
        "name": "Apache Kafka",
        "version_range": "4.1.x",
        "required": true
      },
      {
        "name": "aiokafka",
        "version_range": "0.14.x",
        "required": true
      },
      {
        "name": "AsyncAPI",
        "version_range": "3.0",
        "required": true
      }
    ],
    "delivery": [
      {
        "name": "OCI image",
        "version_range": "digest-pinned base",
        "required": true
      }
    ],
    "testing": [
      {
        "name": "pytest",
        "version_range": "9.1.x",
        "required": true
      }
    ],
    "observability": [
      {
        "name": "consumer lag, offsets, replay and poison-event metrics",
        "version_range": "project decision",
        "required": true
      }
    ]
  },
  "required_capabilities": [
    "CAP-SCAFFOLD-COPY",
    "CAP-PYTHON-QUALITY",
    "CAP-STREAM-KAFKA",
    "CAP-OCI-RUNTIME",
    "CAP-DELIVERY-EVIDENCE"
  ],
  "excluded_capabilities": [
    "CAP-FRONTEND-QUALITY",
    "CAP-STATIC-BUNDLE",
    "CAP-BROWSER-PLAYWRIGHT",
    "CAP-API-CONTRACT",
    "CAP-IDENTITY-OIDC",
    "CAP-DATA-POSTGRES",
    "CAP-SSR-RUNTIME",
    "CAP-MESSAGE-RABBITMQ"
  ],
  "capability_bindings": [
    {
      "capability_id": "CAP-SCAFFOLD-COPY",
      "provider": "LKS-SDD copy driver",
      "version_range": "1.0.0"
    },
    {
      "capability_id": "CAP-PYTHON-QUALITY",
      "provider": "uv, Ruff, mypy and pytest",
      "version_range": "1.0.0"
    },
    {
      "capability_id": "CAP-STREAM-KAFKA",
      "provider": "aiokafka and Apache Kafka",
      "version_range": "0.14 / 4.1"
    },
    {
      "capability_id": "CAP-OCI-RUNTIME",
      "provider": "Docker Compose",
      "version_range": "OCI 1.x"
    },
    {
      "capability_id": "CAP-DELIVERY-EVIDENCE",
      "provider": "LKS-SDD G4 evidence",
      "version_range": "1.0.0"
    }
  ],
  "compatibility_rules": [
    "Kafka streaming is not interchangeable with RabbitMQ messaging.",
    "Partition key, ordering scope, schema compatibility, consumer groups and offset ownership are explicit.",
    "Replay is an authorized operation with a bounded source offset and observable lag.",
    "The profile remains candidate until broker integration, offsets and recovery gates pass."
  ],
  "drivers": {
    "prepare": "profile-driver.json",
    "verify": "profile-driver.json"
  },
  "gates": {
    "capability_gate_ids": [
      "GATE-SCAFFOLD-INTEGRITY",
      "GATE-PYTHON-LOCK",
      "GATE-PYTHON-LINT",
      "GATE-PYTHON-TYPECHECK",
      "GATE-PYTHON-TEST",
      "GATE-STR-CONTRACT",
      "GATE-STR-REPLAY",
      "GATE-STR-OFFSETS",
      "GATE-STR-RECOVERY",
      "GATE-OCI-BUILD",
      "GATE-OCI-SMOKE",
      "GATE-DELIVERY-EVIDENCE"
    ],
    "composition_gate_id": "GATE-COMPOSE-KAFKA-PROCESSOR"
  },
  "owner": "LKS-SDD maintainers"
}
