[project]
name = "lks-sdd-reference-backend"
version = "0.1.0"
description = "Reference FastAPI boundary for the LKS-SDD controlled simulated OIDC profile"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "PyJWT[crypto]==2.13.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["lks_sdd_app"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lks_sdd_app"]
