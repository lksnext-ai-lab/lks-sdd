services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: lks_sdd
      POSTGRES_PASSWORD: reference-only-not-production
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lks_sdd -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      APP_ENV: verification
      DATABASE_URL: postgresql+psycopg://lks_sdd:reference-only-not-production@postgres:5432/app
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:18000/__test__/oidc}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-api://lks-sdd-reference-api}
      SIMULATED_TENANT_ID: ${SIMULATED_TENANT_ID:-synthetic-tenant}
      SIMULATED_SUBJECT_ID: ${SIMULATED_SUBJECT_ID:-synthetic-user}
      SIMULATED_OBJECT_ID: ${SIMULATED_OBJECT_ID:-synthetic-object-001}
      SIMULATED_USERNAME: ${SIMULATED_USERNAME:-synthetic.user@example.invalid}
      OIDC_REQUIRED_SCOPE: ${OIDC_REQUIRED_SCOPE:-api.read}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-Api.Read.All}
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
