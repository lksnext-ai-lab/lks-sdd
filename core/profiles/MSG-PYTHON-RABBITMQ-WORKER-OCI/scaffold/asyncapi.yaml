asyncapi: 3.0.0
info:
  title: LKS-SDD message worker
  version: 1.0.0
channels:
  work:
    address: work.v1
    messages:
      workMessage:
        $ref: '#/components/messages/WorkMessage'
operations:
  processWork:
    action: receive
    channel:
      $ref: '#/channels/work'
components:
  messages:
    WorkMessage:
      payload:
        type: object
        required: [message_id, attempt, payload]
        properties:
          message_id: {type: string}
          attempt: {type: integer, minimum: 0}
          payload: {type: object}
