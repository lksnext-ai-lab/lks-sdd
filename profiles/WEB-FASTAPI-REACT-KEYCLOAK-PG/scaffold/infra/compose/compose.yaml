services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:18080
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${LKS_SDD_KEYCLOAK_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /realms/lks-sdd/.well-known/openid-configuration HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: infra/containers/backend.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      OIDC_ISSUER: http://127.0.0.1:18080/realms/lks-sdd
      OIDC_JWKS_URL: http://keycloak:8080/realms/lks-sdd/protocol/openid-connect/certs
      OIDC_AUDIENCE: lks-sdd-api
    ports:
      - "${LKS_SDD_BACKEND_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/containers/frontend.Dockerfile
      args:
        VITE_OIDC_URL: http://127.0.0.1:18080
        VITE_OIDC_REALM: lks-sdd
        VITE_OIDC_CLIENT_ID: lks-sdd-spa
    ports:
      - "${LKS_SDD_FRONTEND_PORT:-15173}:8080"
    depends_on:
      - backend

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    profiles: ["gate"]
    network_mode: host
    working_dir: /work/apps/frontend
    command: ["sh", "-lc", "npx --yes pnpm@10.34.5 install --frozen-lockfile && npx --yes playwright test --config playwright.fullstack.config.ts"]
    volumes:
      - ../..:/work
      - e2e-node-modules:/work/apps/frontend/node_modules
    depends_on:
      - frontend

volumes:
  postgres-data:
  e2e-node-modules:
