name: quality

env:
  LKS_SDD_RUNNER_CLASS: github-windows-latest
  PYTHONDONTWRITEBYTECODE: "1"

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.txt
      - name: Plugin contract
        run: python -X utf8 scripts/validate_plugin_contract.py .

  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.txt
      - name: Compact candidate gate
        shell: pwsh
        run: python -X utf8 scripts/run_release_gate.py --channel candidate --output "${{ runner.temp }}\release-gate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-release-gate
          path: ${{ runner.temp }}\release-gate.json
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.txt
      - name: Release context
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          $version = (Get-Content .codex-plugin\plugin.json -Raw | ConvertFrom-Json).version
          $channel = if ($version.Contains('-')) { "candidate" } else { "stable" }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "La etiqueta no coincide con el manifest: $env:GITHUB_REF_NAME vs v$version" }
          "LKS_SDD_CERTIFICATION_DATE=$date" >> $env:GITHUB_ENV
          "LKS_SDD_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "LKS_SDD_RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
      - name: Compact release gate
        shell: pwsh
        run: |
          $date = $env:LKS_SDD_CERTIFICATION_DATE
          $channel = $env:LKS_SDD_RELEASE_CHANNEL
          $approval = @()
          if ($channel -eq "stable") { $approval = @("--release-approval", "quality\release-approval-v$env:LKS_SDD_RELEASE_VERSION.json") }
          python -X utf8 scripts/run_release_gate.py --channel $channel --date $date @approval --output "$env:RUNNER_TEMP\release-gate.json"
      - name: Build and validate release package
        shell: pwsh
        run: |
          $date = $env:LKS_SDD_CERTIFICATION_DATE
          $commit = (git rev-parse HEAD).Trim()
          python -X utf8 scripts/build_candidate_package.py --date $date --source-commit $commit --quality-report "$env:RUNNER_TEMP\release-gate.json" --output "$env:RUNNER_TEMP\candidate"
          if ($LASTEXITCODE -ne 0) { throw "Build inválido" }
          $version = (Get-Content .codex-plugin\plugin.json -Raw | ConvertFrom-Json).version
          python -X utf8 scripts/validate_copilot_package.py "$env:RUNNER_TEMP\candidate\lks-sdd-copilot-plugin-v$version.zip"
          if ($LASTEXITCODE -ne 0) { throw "Plugin Copilot inválido" }
          foreach ($kind in @('plugin', 'marketplace')) {
            $install = "$env:RUNNER_TEMP\clean-install-$kind"
            Expand-Archive "$env:RUNNER_TEMP\candidate\lks-sdd-$kind-v$version.zip" -DestinationPath $install
            $validators = @(Get-ChildItem -LiteralPath $install -Filter validate_plugin_contract.py -File -Recurse)
            if ($validators.Count -ne 1) { throw "Raíz de plugin ambigua." }
            $pluginRoot = $validators[0].Directory.Parent.FullName
            python -X utf8 $validators[0].FullName $pluginRoot
            if ($LASTEXITCODE -ne 0) { throw "Bundle inválido: $kind" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            ${{ runner.temp }}\release-gate.json
            ${{ runner.temp }}\candidate
          retention-days: 90
