[project]
name = "lks-sdd-local-auth"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.141.1", "sqlalchemy==2.0.52", "alembic==1.19.1", "PyJWT==2.13.0", "uvicorn==0.52.4", "psycopg[binary]==3.3.4", "argon2-cffi==25.1.0"]
[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.3", "mypy==2.3.1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py314"
line-length = 140
[tool.ruff.lint]
select = ["F", "E9"]
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
