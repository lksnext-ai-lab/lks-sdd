{
  "schema_version": "2.0",
  "id": "WEB-REACT-VITE-STATIC",
  "version": "1.0.0",
  "family_id": "FAM-WEB-SPA-STATIC",
  "profile_scope": "deployable",
  "lifecycle": "active",
  "support_level": "H1",
  "default_rigor": "P1",
  "summary": "React and Vite single-page application compiled to immutable static assets without an application server.",
  "units": [
    {
      "role": "frontend",
      "runtime": "browser and static host",
      "default_path": "."
    }
  ],
  "dimensions": {
    "frontend": [
      {
        "name": "Node.js",
        "version_range": "24.x LTS",
        "required": true
      },
      {
        "name": "React",
        "version_range": "19.2.x",
        "required": true
      },
      {
        "name": "TypeScript",
        "version_range": "6.0.x",
        "required": true
      },
      {
        "name": "Vite",
        "version_range": "8.2.x",
        "required": true
      }
    ],
    "backend": [],
    "data": [],
    "identity": [],
    "integration": [],
    "delivery": [
      {
        "name": "static hosting",
        "version_range": "immutable-bundle contract 1.0",
        "required": true
      }
    ],
    "testing": [
      {
        "name": "Vitest",
        "version_range": "4.1.x",
        "required": true
      },
      {
        "name": "Playwright",
        "version_range": "1.62.x",
        "required": true
      },
      {
        "name": "axe-core",
        "version_range": "4.13.x",
        "required": true
      }
    ],
    "observability": [
      {
        "name": "client error and delivery monitoring",
        "version_range": "project decision",
        "required": false
      }
    ]
  },
  "required_capabilities": [
    "CAP-SCAFFOLD-COPY",
    "CAP-FRONTEND-QUALITY",
    "CAP-STATIC-BUNDLE",
    "CAP-BROWSER-PLAYWRIGHT",
    "CAP-DELIVERY-EVIDENCE"
  ],
  "excluded_capabilities": [
    "CAP-API-CONTRACT",
    "CAP-IDENTITY-OIDC",
    "CAP-DATA-POSTGRES",
    "CAP-OCI-RUNTIME",
    "CAP-SSR-RUNTIME",
    "CAP-MESSAGE-RABBITMQ",
    "CAP-STREAM-KAFKA"
  ],
  "capability_bindings": [
    {
      "capability_id": "CAP-SCAFFOLD-COPY",
      "provider": "LKS-SDD copy driver",
      "version_range": "1.0.0"
    },
    {
      "capability_id": "CAP-FRONTEND-QUALITY",
      "provider": "ESLint + TypeScript + Vitest",
      "version_range": "10 / 6 / 4"
    },
    {
      "capability_id": "CAP-STATIC-BUNDLE",
      "provider": "React + Vite + npm",
      "version_range": "React 19.2 / Vite 8.2"
    },
    {
      "capability_id": "CAP-BROWSER-PLAYWRIGHT",
      "provider": "Playwright + axe-core",
      "version_range": "1.62 / 4.13"
    },
    {
      "capability_id": "CAP-DELIVERY-EVIDENCE",
      "provider": "LKS-SDD G4 evidence",
      "version_range": "1.0.0"
    }
  ],
  "compatibility_rules": [
    "The profile excludes a project-owned backend, server-side rendering, identity and server persistence.",
    "Selection requires a confirmed ADR and cannot be inferred from the presence of frontend requirements.",
    "Deep-link fallback, runtime configuration, browser support and local-storage compatibility are explicit project decisions.",
    "A build-time environment change creates a different artifact and must receive a different digest."
  ],
  "drivers": {
    "prepare": "profile-driver.json",
    "verify": "profile-driver.json"
  },
  "gates": {
    "capability_gate_ids": [
      "GATE-SCAFFOLD-INTEGRITY",
      "GATE-FRONTEND-LOCK",
      "GATE-FRONTEND-LINT",
      "GATE-FRONTEND-TYPECHECK",
      "GATE-FRONTEND-TEST",
      "GATE-FRONTEND-BUILD",
      "GATE-STATIC-OUTPUT",
      "GATE-BROWSER-SMOKE",
      "GATE-BROWSER-ACCESSIBILITY",
      "GATE-DELIVERY-EVIDENCE"
    ],
    "composition_gate_id": "GATE-COMPOSE-REACT-STATIC"
  },
  "owner": "LKS-SDD maintainers"
}
